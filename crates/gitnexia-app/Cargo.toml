[package]
name = "gitnexia-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "gitnexia"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[features]
default = ["cef"]
# The bundled Chromium runtime (Linux, Windows, macOS). Off only for the macOS WKWebView spike:
#   cargo build -p gitnexia-app --no-default-features --features macos-wkwebview,tauri/custom-protocol
cef = ["dep:tauri-runtime-cef"]
# The macOS spike: Tauri's system-webview runtime (WKWebView) instead of the bundled CEF. See
# docs/macos-wkwebview-spike.md.
macos-wkwebview = ["dep:tauri-runtime-wry"]
# An isolated, unreleased system-webview build. It must not be combined with CEF.
system-webview-beta = ["dep:tauri-runtime-wry", "gitnexia-core/system-webview-beta"]

[dependencies]
gitnexia-core.workspace = true
gitnexia-forge.workspace = true
gitnexia-ai.workspace = true
tauri.workspace = true
tauri-runtime-cef = { workspace = true, optional = true }
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-opener.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gdk4-x11.workspace = true
gio.workspace = true
glib.workspace = true
raw-window-handle.workspace = true
x11-dl.workspace = true

# The title bar's double click, from the user defaults (chrome.rs); the displays' changes
# (window_state.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation.workspace = true
block2.workspace = true
# The `macos-wkwebview` spike's runtime (see `[features]`).
tauri-runtime-wry = { workspace = true, optional = true }

# The folder dialog's owner window (`portal_parent`).
[target.'cfg(windows)'.dependencies]
raw-window-handle.workspace = true
tauri-runtime-wry = { workspace = true, optional = true }
