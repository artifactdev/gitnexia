name: System webview beta build check

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: system-webview-beta-${{ matrix.os }}
          cache-bin: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Build UI
        working-directory: ui
        run: npm run build
      - name: Test beta paths
        run: cargo test --locked -p gitnexia-core --features system-webview-beta paths::tests
      - name: Build system webview binary
        run: cargo build --locked --release -p gitnexia-app --no-default-features --features system-webview-beta,tauri/custom-protocol
      - name: Explain distribution status
        shell: bash
        run: |
          echo "Build check only: no packages or releases are published." >> "$GITHUB_STEP_SUMMARY"
          echo "Do not distribute these binaries: isolation, privacy, licensing and beta updates are not complete." >> "$GITHUB_STEP_SUMMARY"
